<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocalShield AI - Live Security Shield</title>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #131c2e;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid #1e293b;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .viewport-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #1e293b;
        }

        video, #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        video {
            transform: scaleX(-1);
        }

        #overlayCanvas {
            z-index: 10;
            pointer-events: none;
        }

        .hud-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            background-color: #0b1120;
            border: 1px solid #1e293b;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1rem;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-sub);
        }

        .status-active .indicator-dot {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .status-warning .indicator-dot {
            background-color: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .metric-box {
            background-color: #0b1120;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #1e293b;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 4px;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <header>
        <h1>VocalShield AI Shield</h1>
        <p>Real-Time Facial Verification & Endpoint Protection</p>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <div class="viewport-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="overlayCanvas"></canvas>
            </div>

            <div id="hudBox" class="hud-status">
                <div id="statusBadge" class="status-badge">
                    <span class="indicator-dot"></span>
                    <span id="statusText">Initializing hardware stream...</span>
                </div>
                <div id="latencyText" style="font-size: 0.85rem; color: var(--text-sub);">Latency: -- ms</div>
            </div>

            <div class="metrics-panel">
                <div class="metric-box">
                    <div class="metric-label">Faces Tracked</div>
                    <div id="metricFaces" class="metric-value">0</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Shield Status</div>
                    <div id="metricShield" class="metric-value">STANDBY</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Frames Processed</div>
                    <div id="metricFPS" class="metric-value">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden canvas used for grabbing frames -->
    <canvas id="processingCanvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const processingCanvas = document.getElementById('processingCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const processingCtx = processingCanvas.getContext('2d');

        const hudBox = document.getElementById('hudBox');
        const statusText = document.getElementById('statusText');
        const latencyText = document.getElementById('latencyText');
        const metricFaces = document.getElementById('metricFaces');
        const metricShield = document.getElementById('metricShield');
        const metricFPS = document.getElementById('metricFPS');

        let totalProcessedFrames = 0;
        let isProcessing = false;

        function resizeCanvas() {
            overlayCanvas.width = video.clientWidth || 640;
            overlayCanvas.height = video.clientHeight || 480;
        }
        window.addEventListener('resize', resizeCanvas);

        // Access web camera stream
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    resizeCanvas();
                    statusText.textContent = "Camera Feed Active — Scanning User";
                    setInterval(processWebcamFrame, 400);
                };
            })
            .catch(err => {
                console.error("Camera access error:", err);
                statusText.textContent = "Hardware Access Denied / Unavailable";
                hudBox.className = "hud-status status-warning";
            });

        function processWebcamFrame() {
            if (isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;

            isProcessing = true;
            const startTime = performance.now();

            // Render current frame to hidden processing canvas
            processingCtx.drawImage(video, 0, 0, processingCanvas.width, processingCanvas.height);
            const base64Image = processingCanvas.toDataURL('image/jpeg', 0.6);

            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            })
            .then(res => res.json())
            .then(data => {
                const latency = Math.round(performance.now() - startTime);
                latencyText.textContent = `Latency: ${latency} ms`;
                
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                if (data.status === 'success') {
                    totalProcessedFrames++;
                    metricFPS.textContent = totalProcessedFrames;
                    metricFaces.textContent = data.faces_count;

                    if (data.face_detected) {
                        hudBox.className = "hud-status status-active";
                        statusText.textContent = `User Verified (${data.faces_count} Face Detected)`;
                        metricShield.textContent = "PROTECTED";
                        metricShield.style.color = "var(--accent-green)";

                        // Draw bounding box over canvas
                        const scaleX = overlayCanvas.width / processingCanvas.width;
                        const scaleY = overlayCanvas.height / processingCanvas.height;

                        data.faces.forEach(face => {
                            // Mirror X coordinate to align with CSS video mirror
                            const mirroredX = processingCanvas.width - face.x - face.width;
                            
                            overlayCtx.strokeStyle = "#22c55e";
                            overlayCtx.lineWidth = 3;
                            overlayCtx.strokeRect(
                                mirroredX * scaleX, 
                                face.y * scaleY, 
                                face.width * scaleX, 
                                face.height * scaleY
                            );

                            overlayCtx.fillStyle = "#22c55e";
                            overlayCtx.font = "14px Inter, sans-serif";
                            overlayCtx.fillText("VERIFIED USER", mirroredX * scaleX, (face.y * scaleY) - 8);
                        });
                    } else {
                        hudBox.className = "hud-status status-warning";
                        statusText.textContent = "Warning: No User In View";
                        metricShield.textContent = "ALERT";
                        metricShield.style.color = "var(--accent-red)";
                    }
                }
                isProcessing = false;
            })
            .catch(err => {
                console.error("Transmission error:", err);
                isProcessing = false;
            });
        }
    </script>
</body>
</html>
